<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Score Keeper</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Score Keeper</h1>
  </header>

  <main>
    <section>
      <h2>Team A</h2>
      <p>Score: <span id="team-a-score">0</span></p>
      <button type="button" onclick="incrementTeamA()">+</button>
      <button type="button" onclick="decrementTeamA()">-</button>
    </section>

    <section>
      <h2>Team B</h2>
      <p>Score: <span id="team-b-score">0</span></p>
      <button type="button" onclick="incrementTeamB()">+</button>
      <button type="button" onclick="decrementTeamB()">-</button>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
